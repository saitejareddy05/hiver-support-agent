brand: AmazonHelp
model_name: gpt-4o-mini
llm_provider: openai_compatible
llm_api_key_env: LLM_API_KEY
llm_base_url_env: LLM_BASE_URL
escalation_confidence_threshold: 0.60
retrieval_top_k: 3
max_reply_chars: 500
random_seed: 42
data:
  raw_csv: data/raw/twcs.csv
  processed_csv: data/processed/amazonhelp_threads.csv
  sample_csv: data/processed/sample.csv
  golden_csv: data/golden_set/golden_eval.csv
